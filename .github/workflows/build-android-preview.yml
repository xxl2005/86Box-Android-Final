name: Build Android preview APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-android-preview.yml
      - android/**
      - src/unix/sdl_main.c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Build complete native core and universal APK
        shell: cmd
        run: android\BUILD_APK.bat build
      - uses: actions/upload-artifact@v4
        with:
          name: 86Box-Android-v0.11.3-preview-build
          path: 86Box-Android-universal64-v0.11.3-debug.apk
          if-no-files-found: error
      - name: Check APK identity and architectures
        shell: pwsh
        run: |
          $apk = '86Box-Android-universal64-v0.11.3-debug.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'Universal APK missing' }
          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\aapt.exe'
          $badging = & $aapt dump badging $apk
          $badging | Select-String 'package:|application-label:'
          $badgeText = $badging -join "`n"
          if ($badgeText -notmatch "versionCode='85'") { throw 'Wrong version code' }
          if ($badgeText -notmatch "versionName='0.11.3'") { throw 'Wrong version name' }
          if ($badgeText -notmatch "application-label:'86Box Android'") { throw 'Wrong app label' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $apk).Path)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $cores = @($names | Where-Object { $_ -match '^lib/[^/]+/libmain\.so$' })
            Write-Host ('Native cores: ' + ($cores -join ', '))
            if ($names -notcontains 'lib/arm64-v8a/libmain.so') { throw 'ARM64 core missing' }
            if ($names -notcontains 'lib/x86_64/libmain.so') { throw 'x86_64 core missing' }
          } finally {
            $zip.Dispose()
          }

